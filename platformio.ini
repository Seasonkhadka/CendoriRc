[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
; PSRAM (octal, N8R8) is mandatory here - esp_lcd_new_rgb_panel's own
; ~750KB frame buffer can't fit in 320KB internal SRAM (confirmed on real
; hardware). Configured via sdkconfig.defaults now (CONFIG_SPIRAM_MODE_OCT
; etc.), not an Arduino board_build.* key - there is no Arduino framework
; layer left in this project.
board_build.f_cpu = 160000000L
; 3 MB app partition for Wi-Fi (see partitions.csv). Flash with a full
; upload after changing it - the partition table itself is rewritten.
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
extra_scripts =
    pre:scripts/fix_lang_flags.py
    pre:scripts/stamp_build_time.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
monitor_speed = 115200
monitor_port = COM4
monitor_dtr = 0
monitor_rts = 0
upload_port = COM4
upload_speed = 115200
upload_protocol = esptool
debug_tool = esp-prog
lib_deps =
    lvgl/lvgl@^8.3.11
    https://github.com/Sensirion/arduino-gas-index-algorithm.git
