[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Reverted: qio_qspi (no PSRAM) looked like it avoided the PSRAM boot abort,
; but esp_lcd_new_rgb_panel (Arduino_GFX's RGB panel driver) hard-requires a
; PSRAM-backed full frame buffer (800x480x2 ~750KB - can't fit in 320KB
; internal SRAM). Confirmed on real hardware: it just traded the PSRAM abort
; for "no mem for frame buffer" at esp_lcd_new_rgb_panel. PSRAM is not
; optional for this display - back to qio_opi.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_cpu = 160000000L
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
monitor_port = COM4
monitor_dtr = 0
monitor_rts = 0
upload_port = COM4
upload_speed = 115200
upload_protocol = esptool
debug_tool = esp-prog
lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    lvgl/lvgl@^8.3.11
    https://github.com/Sensirion/arduino-gas-index-algorithm.git
 